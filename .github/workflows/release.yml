# A GitHub Release for every version tag: the install zip as a fixed-name asset, so
# `releases/latest/download/courtyard.zip` always is the newest version, plus the
# versioned name, the built Courtyard app (for installs without the Command Line Tools)
# and generated notes. install.sh downloads the tag's zip; this makes the version
# visible and gives it a page.
#
# The version lives in pyproject.toml and, copied, in uv.lock; the tag must match it, and
# both files must move together (a hand edit of pyproject.toml leaves uv.lock behind
# until the next uv command, which then dirties the tree). So, on the branch, before the
# merge:
#
#   uv version 0.2.0            # edits pyproject.toml AND uv.lock (or: --bump patch)
#   uv lock --check             # exits non-zero if the lock is behind pyproject.toml
#   git add pyproject.toml uv.lock && git commit -m "- bump version to 0.2.0"
#
# then, once it is on main:
#
#   git tag v0.2.0 && git push --tags
#
# The process is written out in docs/development.md ("Releasing").

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Courtyard.app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          sh app/build.sh build/Courtyard.app com.courtyard.app Courtyard "$version"
          ditto -c -k --keepParent build/Courtyard.app Courtyard.app.zip
          ls -la Courtyard.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Courtyard.app
          path: Courtyard.app.zip

  release:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Build the install zip
        run: |
          make zip-package
          cp courtyard-*.zip courtyard.zip
          ls -la courtyard*.zip

      - uses: actions/download-artifact@v4
        with:
          name: Courtyard.app

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            courtyard.zip courtyard-*.zip Courtyard.app.zip \
            --title "Agent Courtyard ${GITHUB_REF_NAME}" \
            --generate-notes
